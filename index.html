<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi d'entraînement de course</title>
    <!-- Intégration de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .time-diff.behind { color: red; font-weight: bold; }
        .time-diff.ahead { color: green; font-weight: bold; }
        .fade-out { opacity: 0; transition: opacity 0.5s; }
        .hide { display: none; }
        #map { height: 500px; width: 100%; border: 1px solid #ccc; margin-top: 20px; }
        .controls-container { margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .btn { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; font-size: 14px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { padding: 10px; background: #e9ecef; border-left: 5px solid #007bff; margin-bottom: 15px; }
        #positionInfo, #waypointInfo { padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Suivi d'entraînement de course</h1>

    <div class="controls-container">
        <div id="gpxImportContainer">
            <label for="gpxFile"><strong>1. Charger un fichier GPX :</strong></label><br>
            <input type="file" id="gpxFile" accept=".gpx" />
        </div>
        <div class="button-group" style="margin-top: 15px;">
            <button id="toggleTraining" class="btn btn-primary" disabled>Démarrer l'entraînement</button>
            <button id="nextWaypoint" class="btn btn-secondary" disabled>Passer au waypoint suivant</button>
        </div>
    </div>

    <div id="status">Chargez un fichier GPX pour commencer.</div>

    <div id="positionInfo">
        <strong>Position actuelle :</strong> Non disponible<br>
        <strong>Précision GPS :</strong> -<br>
        <strong>Rayon de détection :</strong> -<br>
        <strong>Prochain waypoint :</strong> -<br>
        <strong>Distance restante :</strong> -
    </div>

    <div id="waypointInfo">Aucun waypoint chargé.</div>

    <div id="history">
        <h3>Historique des waypoints</h3>
        <p>Aucun waypoint atteint pour l'instant.</p>
    </div>

    <!-- Conteneur de la carte -->
    <div id="map"></div>

    <!-- Scripts : Leaflet d'abord, puis notre logique -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
